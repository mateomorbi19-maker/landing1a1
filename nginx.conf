server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # La imagen oficial de nginx trae gzip comentado: verificado el 2026-08-04
    # contra teotec.org, que devolvía el HTML entero sin comprimir aunque el
    # cliente pidiera gzip. El HTML es render-blocking, así que son bytes
    # que frenan el primer pintado.
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # El HTML tiene que poder cambiar en cada deploy; los assets llevan
    # nombre estable, así que se cachean fuerte.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(webp|png|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # =404 y no un fallback a index.html: si mañana falta un asset, quiero un
    # 404 y no una respuesta 200 con HTML adentro que lo disimule.
    location / {
        try_files $uri $uri/ =404;
    }
}
